<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>RideBike – App-Vorschau</title>
<meta name="author" content="Florian Enders">
<style>
  :root {
    --bg:#070b10; --line:rgba(255,255,255,.09); --text:#eef4f8; --muted:rgba(226,236,244,.62);
    --grad:linear-gradient(135deg,#b4f35a,#5fcb2b); --accent:#8be13a;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:Inter, Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }

  .app { position:fixed; inset:0; display:flex; flex-direction:column;
    background:radial-gradient(700px 400px at 0% 0%, rgba(139,225,58,.12), transparent 60%),
               radial-gradient(600px 400px at 100% 100%, rgba(60,120,200,.14), transparent 60%), var(--bg); }

  /* Kopf */
  .top { flex:none; padding:calc(10px + var(--st)) 14px 8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:34px; height:34px; border-radius:10px; }
  .brand h1 { margin:0; font-size:20px; font-weight:900; font-style:italic; letter-spacing:-.6px; flex:1; }
  .brand h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand .mode { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.07); border:1px solid var(--line); }
  .brand .mode svg { width:18px; height:18px; }
  .chips { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin:10px -14px 0; padding:0 14px; scroll-behavior:smooth; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 13px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;
    background:rgba(255,255,255,.06); border:1px solid var(--line); transition:all .2s; }
  .chip.on { background:var(--grad); color:#0c1a05; border-color:transparent; }

  /* Karussell */
  .stage { flex:1; min-height:0; position:relative; }
  .track { position:absolute; inset:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
    scrollbar-width:none; overscroll-behavior-x:contain; }
  .track::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; padding:4px 0; }
  .phone { height:100%; max-width:92vw; aspect-ratio:390/844; border-radius:30px; padding:6px;
    background:linear-gradient(160deg,#1f2a35,#0a0f15); box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.08); }
  .phone img, .phone video { display:block; width:100%; height:100%; object-fit:cover; border-radius:25px; background:#101820; }
  .nav-btn { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
    background:rgba(10,15,22,.75); border:1px solid var(--line); display:none; place-items:center; font-size:24px; z-index:2; }
  .nav-btn.prev { left:16px; } .nav-btn.next { right:16px; }
  @media (hover:hover) and (min-width:700px) { .nav-btn { display:grid; } }

  /* Fuß */
  .foot { flex:none; padding:8px 18px calc(12px + var(--sb)); text-align:center; }
  .cat { font-size:11px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--accent); }
  .title { font-size:18px; font-weight:800; margin-top:2px; }
  .desc { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4; min-height:2.8em; }
  .progress { display:flex; gap:4px; justify-content:center; margin-top:10px; }
  .progress i { height:4px; width:10px; border-radius:2px; background:rgba(255,255,255,.18); transition:all .25s; }
  .progress i.on { width:22px; background:var(--grad); }
  .copy { font-size:10.5px; color:rgba(255,255,255,.38); margin-top:8px; }

  /* Übersicht (Raster) */
  .grid-view { position:absolute; inset:0; overflow-y:auto; padding:6px 14px calc(20px + var(--sb)); display:none;
    -webkit-overflow-scrolling:touch; }
  .app.grid .grid-view { display:block; }
  .app.grid .track, .app.grid .nav-btn { display:none; }
  .app.grid .foot .title, .app.grid .foot .desc, .app.grid .foot .cat, .app.grid .progress { display:none; }
  .grid-view h2 { font-size:12px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); margin:16px 2px 10px; }
  .grid-view h2:first-child { margin-top:4px; }
  .thumbs { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  @media (min-width:700px) { .thumbs { grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); } }
  .thumb { text-align:left; }
  .thumb .ph { border-radius:16px; padding:3px; background:linear-gradient(160deg,#1f2a35,#0a0f15); box-shadow:0 8px 20px rgba(0,0,0,.4); }
  .thumb img { display:block; width:100%; aspect-ratio:390/844; object-fit:cover; border-radius:13px; background:#101820; }
  .thumb b { display:block; font-size:12px; margin-top:6px; line-height:1.25; }
  .note { margin:18px 0 0; font-size:12px; color:var(--muted); line-height:1.5; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line); }

  .hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); padding:7px 14px; border-radius:999px;
    background:rgba(10,15,22,.85); border:1px solid var(--line); font-size:12px; font-weight:700; pointer-events:none;
    animation:hint 3.2s ease .8s forwards; opacity:0; z-index:3; }
  @keyframes hint { 10%,75% { opacity:1; } 100% { opacity:0; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand">
      <img src="logo.svg" alt="RideBike">
      <h1>Ride<span>Bike</span> <small style="font-style:normal;font-weight:600;font-size:13px;color:var(--muted)">Vorschau v1.6</small></h1>
      <button class="mode" id="mode" aria-label="Ansicht wechseln"></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="stage">
    <div class="track" id="track"></div>
    <button class="nav-btn prev" id="prev" aria-label="Zurück">‹</button>
    <button class="nav-btn next" id="next" aria-label="Weiter">›</button>
    <div class="grid-view" id="grid"></div>
    <div class="hint" id="hint">← wischen →</div>
  </div>

  <div class="foot">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="desc" id="desc"></div>
    <div class="progress" id="progress"></div>
    <div class="copy">© 2026 Florian Enders · Kartendaten © OpenStreetMap-Mitwirkende</div>
  </div>
</div>

<script>
const CATS = [
  { id:'video', name:'Video', items:[
    ['video','Animierte Vorschau','30 Sekunden durch die App: 3D-Karte, Trails, Kartenstile, Tageslicht, Route, Mein Rad, Offline und Navigation.'] ]},
  { id:'start', name:'Karte & 3D', items:[
    ['24-3d-mittag','3D-Luftbild mittags (neu)','Steile Kamera, HD-Gelände, ziehende Wolken und blauer Dunst in der Ferne.'],
    ['25-3d-abend','3D-Luftbild abends (neu)','Sonne mit Lichthof am echten Sonnenstand, warmes Licht über dem Horizont.'],
    ['28-mehr-menue','Mehr-Menü (neu)','Rechts nur 3D, Ebenen, Route und Mehr – alles Weitere im ausklappbaren Menü.'],
    ['27-3d-kartenstil','3D auch im Kartenstil (neu)','Relief mit Sonnenlicht, Dunst und Weitwinkel gelten jetzt für alle Kartenstile.'],
    ['26-3d-nacht','3D-Luftbild nachts (neu)','Sternenhimmel, abgedunkeltes Luftbild, leuchtende Radwege.'],
    ['01-splash','Startbildschirm','Bergspitzen-Logo, gezeichneter Trail und animierter Schriftzug.'],
    ['02-karte-legende','Karte mit Legende','Radwege grün, Wald- & Feldwege blau, Pfade gelb, MTB-Trails rot – mit MTB-Skala S0–S6.'],
    ['03-abendlicht','Abendlicht','Himmel, Licht und Schatten folgen dem echten Sonnenstand.'],
    ['04-nachtkarte','Nachtkarte','Nach Sonnenuntergang wechselt die Karte automatisch auf Night.'] ]},
  { id:'stil', name:'Kartenstile', items:[
    ['05-kartenstil','Kartenstil','7 Stile mit Vorschaubild, grünem Haken und 3D-Schalter.'],
    ['06-kartenstil-night','Night gewählt','Stilwechsel mit weicher Überblendung.'] ]},
  { id:'route', name:'Routenplanung', items:[
    ['07-suche','Suche','Orte in der Nähe mit passendem Symbol.'],
    ['08-route','Route planen','Start, Ziel, Via-Punkt, Fahrradprofil, Kennzahlen und Höhenprofil.'],
    ['09-hoehenprofil','Höhenprofil','Antippen zeigt Distanz, Höhe und Steigung – und den Punkt auf der Karte.'],
    ['10-profilmenue','Fahrradprofil','Radtyp direkt in der Planung wechseln.'] ]},
  { id:'rad', name:'Mein Rad', items:[
    ['11-mein-rad','Mein Rad','Fahrrad-Grafik, Typ, Reifenbreite, Gewicht und Aero-Setup.'],
    ['12-mein-rad-mtb','MTB gewählt','Grafik und Routing passen sich dem Radtyp an.'] ]},
  { id:'offline', name:'Offline', items:[
    ['13-offline','Offline-Karten','Kartenzugriff Online / Nur WLAN / Nur offline, Ausschnitt speichern, Verwaltung.'],
    ['14-offline-dialog','Vor dem Start','Karte für unterwegs speichern – optional, mit „Nicht mehr fragen“.'] ]},
  { id:'nav', name:'Navigation', items:[
    ['15-flyover','3D-Flyover','Kamerafahrt entlang der geplanten Route.'],
    ['16-navigation','Navigation','Abbiegepfeil, Seitenknöpfe und Kacheln für Tempo, Strecke und Restzeit.'] ]},
  { id:'ms', name:'Meilensteine', items:[
    ['18-meilensteine','Meilensteine','50 Meilensteine in 8 Kategorien – jeweils Bronze, Silber und Gold.'],
    ['19-ms-detail','Detailansicht','Dein Wert und alle drei Schwellen auf einen Blick.'],
    ['20-ms-feier','Freigeschaltet!','Medaille fliegt drehend ein, mit Lichtstrahlen, Glanz und Konfetti.'],
    ['21-fahrt-zusammenfassung','Fahrt-Zusammenfassung','Strecke, Tempo, Höhenmeter, Höhenprofil, Untergrund und neue Medaillen.'],
    ['22-fahrt-aufzeichnung','Fahrt aufzeichnen','Freie Fahrt mit Zeit, Höhenmetern, Tempo, Strecke und Höchstwert.'],
    ['23-fahrten','Fahrtenliste','Alle aufgezeichneten Fahrten mit Kennzahlen.'] ]},
  { id:'ansicht', name:'Kartenansicht', items:[
    ['17-kartenansicht','Kartenansicht','3D, Licht & Animation, Grafikqualität, Kartendetails und Rad-Ebenen.'] ]}
];
const ALL = [];
CATS.forEach(c => c.items.forEach(([f,t,d]) => ALL.push({ f, t, d, cat:c })));

const $ = (id) => document.getElementById(id);
const app = $('app'), track = $('track'), grid = $('grid');
const ICON_GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const ICON_SWIPE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9l-2 3 2 3M21 9l2 3-2 3"/></svg>';

track.innerHTML = ALL.map((s,i) => `<div class="slide"><div class="phone">${s.f === 'video' ? '<video src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline controls></video>' : `<img src="shots/${s.f}.jpg" alt="${s.t}" ${i>2?'loading="lazy"':''}>`}</div></div>`).join('');
$('chips').innerHTML = CATS.map(c => `<button class="chip" data-c="${c.id}">${c.name}</button>`).join('');
$('progress').innerHTML = ALL.map(() => '<i></i>').join('');
grid.innerHTML = CATS.map(c => `<h2>${c.name}</h2><div class="thumbs">${c.items.map(([f,t]) => {
  const i = ALL.findIndex(s => s.f === f);
  return `<button class="thumb" data-i="${i}"><div class="ph"><img loading="lazy" src="${f === 'video' ? 'poster.jpg' : `shots/${f}.jpg`}" alt="${t}"></div><b>${t}</b></button>`; }).join('')}</div>`).join('')
  + `<p class="note">Aufnahmen aus dem echten App-Code (Version 1.6). Kartenlandschaft, Suchtreffer, Trails und Route stammen aus einer Testumgebung; in der App kommen sie live aus OpenStreetMap.</p>`;

let cur = -1;
function update(i) {
  if (i === cur) return;
  cur = i;
  const s = ALL[i];
  $('cat').textContent = s.cat.name;
  $('title').textContent = s.t;
  $('desc').textContent = s.d;
  [...$('progress').children].forEach((el,k) => el.classList.toggle('on', k === i));
  document.querySelectorAll('.chip').forEach(ch => {
    const on = ch.dataset.c === s.cat.id;
    ch.classList.toggle('on', on);
    if (on) { const box = $('chips'); box.scrollTo({ left: ch.offsetLeft - (box.clientWidth - ch.offsetWidth) / 2, behavior:'smooth' }); }
  });
  try { history.replaceState(null, '', '#' + s.f); } catch {}
}
function go(i, smooth = true) {
  i = Math.max(0, Math.min(ALL.length - 1, i));
  track.scrollTo({ left: i * track.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
  update(i);
}
let raf;
track.addEventListener('scroll', () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => update(Math.round(track.scrollLeft / track.clientWidth)));
}, { passive:true });
window.addEventListener('resize', () => go(cur, false));

$('chips').onclick = (e) => {
  const ch = e.target.closest('.chip'); if (!ch) return;
  if (app.classList.contains('grid')) setGrid(false);
  go(ALL.findIndex(s => s.cat.id === ch.dataset.c));
};
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

function setGrid(on) {
  app.classList.toggle('grid', on);
  $('mode').innerHTML = on ? ICON_SWIPE : ICON_GRID;
  if (!on) requestAnimationFrame(() => go(cur, false));
}
$('mode').onclick = () => setGrid(!app.classList.contains('grid'));
grid.onclick = (e) => {
  const t = e.target.closest('.thumb'); if (!t) return;
  setGrid(false);
  requestAnimationFrame(() => go(Number(t.dataset.i), false));
};

setGrid(false);
const start = Math.max(0, ALL.findIndex(s => '#' + s.f === location.hash));
requestAnimationFrame(() => go(start, false));
</script>
</body>
</html>
