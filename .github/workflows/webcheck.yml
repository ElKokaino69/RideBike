name: Web-Vorschau prüfen
on:
  workflow_dispatch:
    inputs:
      url: { description: 'URL', required: true }
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i puppeteer@24
      - name: Seite öffnen
        env: { URL: '${{ inputs.url }}' }
        run: |
          if [ "$URL" = "local" ]; then curl -sL -o /tmp/rb.html https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/web/index.html; ls -la /tmp/rb.html; export URL=file:///tmp/rb.html; fi
          cat > c.mjs <<'JS'
          import puppeteer from 'puppeteer';
          const b = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'] });
          const p = await b.newPage();
          await p.setViewport({ width: 390, height: 844, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          p.on('pageerror', (e) => console.log('PAGEERR', e.message));
          p.on('console', (m) => { if (m.type() === 'error') console.log('CONSOLE', m.text().slice(0, 200)); });
          const r = await p.goto(process.env.URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
          console.log('STATUS', r?.status?.(), r?.headers?.()['content-type']);
          await new Promise((s) => setTimeout(s, 45000));
          console.log('MAP', await p.evaluate(() => !!document.querySelector('.maplibregl-canvas') + ' ' + document.title));
          await p.screenshot({ path: 'web.jpg', type: 'jpeg', quality: 85 });
          await b.close();
          JS
          node c.mjs
          mkdir out && mv web.jpg out/ && cd out && git init -q && git checkout -q -b webcheck && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm check --allow-empty && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm img && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" webcheck
