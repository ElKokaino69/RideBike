name: RideBike Vorschaubilder
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Vorschau-Server starten
        run: npx vite preview --port 4173 --strictPort &
      - run: npm i --no-save puppeteer@24
      - name: Echte 3D-Ansichten aufnehmen
        run: |
          sleep 5
          node scripts/screens.mjs
      - name: Bilder in Branch "screens" ablegen
        run: |
          cd screens
          git init -q && git checkout -q -b screens
          git config user.name "RideBike Bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "Vorschaubilder ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens
